
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Secret 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ffe0ec, #fff5f8, #ffd6e7);
    color: #9c4266;
}

.card {
    width: 90%;
    max-width: 390px;
    padding: 35px 25px;
    text-align: center;
    background: rgba(255,255,255,0.82);
    border: 2px solid #ffc1d8;
    border-radius: 25px;
    box-shadow: 0 12px 35px rgba(190, 80, 125, 0.18);
    position: relative;
    z-index: 2;
}

.heart {
    font-size: 55px;
    animation: heartbeat 1.5s infinite;
}

h1 {
    font-size: 29px;
    margin: 15px 0 10px;
}

p {
    font-size: 15px;
    line-height: 1.7;
    color: #a66a83;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 1px solid #f3b3cc;
    border-radius: 12px;
    outline: none;
    text-align: center;
    font-size: 16px;
    background: #fff8fb;
    color: #91415f;
}

input:focus {
    border-color: #e878a5;
    box-shadow: 0 0 8px #ffd0e1;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #e878a5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #d85d8d;
    transform: translateY(-2px);
}

#message {
    min-height: 25px;
    margin-top: 15px;
    font-size: 14px;
    color: #d14e7d;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #c58aa2;
}

.floating-heart {
    position: absolute;
    bottom: -40px;
    font-size: 22px;
    opacity: 0.65;
    animation: floatUp 8s linear infinite;
    pointer-events: none;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.65; }
    to {
        transform: translateY(-110vh) rotate(30deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">💌</div>

    <h1>A Little Secret...</h1>

    <p>
        Someone made something special just for you. ♡<br>
        But first, you have to unlock it.
    </p>

    <form id="passwordForm">
        <input
            type="password"
            id="password"
            placeholder="Enter our secret password..."
            autocomplete="off"
            required
        >

        <button type="submit">Unlock Letter ♡</button>
    </form>

    <div id="message"></div>

    <div class="footer">
        Made with love, just for you ♡
    </div>
</div>

<script>
/* CHANGE THIS TO YOUR OWN PASSWORD */
const secretPassword = "iloveyou";

document.getElementById("passwordForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const enteredPassword =
        document.getElementById("password").value;

    if (enteredPassword === secretPassword) {
        document.getElementById("message").textContent =
            "Correct! Opening your letter... 💗";

        setTimeout(function() {
            window.location.href = "letter.html";
        }, 800);
    } else {
        document.getElementById("message").textContent =
            "Oops! That's not our secret password. Try again, love. 💕";
    }
});

/* Floating hearts background */
for (let i = 0; i < 18; i++) {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.textContent = ["♡", "♥", "💕", "💗"][
        Math.floor(Math.random() * 4)
    ];

    heart.style.left = Math.random() * 100 + "%";
    heart.style.animationDelay = Math.random() * 8 + "s";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";

    document.body.appendChild(heart);
}
</script>

</body>
</html>
